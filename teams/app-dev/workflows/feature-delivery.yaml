id: feature-delivery
name: 功能交付流水线
mode: workflow

steps:
  - id: implement
    member: builder
    label: 实现
    autonomy: L1
  - id: review
    member: reviewer
    label: 交叉审查
    requires: [implement]
    gate: human_optional
  - id: integrate
    member: builder
    label: 集成验证
    requires: [review]
    autonomy: L1
  - id: closeout
    member: lead
    label: 收尾沉淀
    requires: [integrate]
    autonomy: L2