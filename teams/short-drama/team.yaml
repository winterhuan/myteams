id: short-drama
name: 短剧创作队
domain: short-drama
description: 从选题到成片的短剧编队，强调创意碰撞与节奏门禁。
defaultMode: thread
hubLayout: episode-board

phases:
  - id: brainstorm
    label: 头脑风暴
    description: 选题、人设、冲突、分集钩子；编剧与策划对等碰撞
    defaultMode: thread
    config: phases/brainstorm.yaml
  - id: scheme
    label: 确定方案
    description: 选定本季/本集方向，分场大纲与节奏门禁
    defaultMode: thread
    config: phases/scheme.yaml
  - id: delivery
    label: 实施
    description: 写剧本、分镜视觉、剪辑节奏
    defaultMode: thread
    config: phases/delivery.yaml

members:
  - id: showrunner
    kind: agent
    role: 总策划
    handle: "@showrunner"
    harness:
      engine: pi
    persona: members/showrunner.md
    autonomy: L2
  - id: writer
    kind: agent
    role: 编剧
    handle: "@writer"
    harness:
      engine: pi
    persona: members/writer.md
    autonomy: L2
  - id: director
    kind: agent
    role: 导演
    handle: "@director"
    harness:
      engine: pi
    persona: members/director.md
    autonomy: L2
  - id: editor
    kind: agent
    role: 剪辑
    handle: "@editor"
    harness:
      engine: pi
    persona: members/editor.md
    autonomy: L1
  - id: human
    kind: human
    role: 委托人
    handle: "@human"
    autonomy: L3

charter: charter.md